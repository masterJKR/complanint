spring.application.name=complanint

server.port=80

# File upload Path Set
spring.servlet.multipart.maxFileSize=20MB
spring.servlet.multipart.maxRequestSize=70MB
filePath=C:/jjkrclass/complainimage
uploadPath=file:///C:/jjkrclass/complainimage


#Database Set
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/krkr
spring.datasource.username=krkr
spring.datasource.password=1234

#thymeleaf  set
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

#MyBatis Set
mybatis.mapper-locations=classpath:/mappers/**.xml
mybatis.configuration.map-underscore-to-camel-case=true

#spring.security.user.name=aaa
#spring.security.user.password=1234